<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="expense_style.css">
</head>
<body>
    <div class="mainBox">
       <h2>Expense Tracker</h2>
          <div class="balanceBox">
                 <p class="balance">your Balance</p>
                 <h1 class="money">$00.00</h1>
                 <div class="inc_exp">
                    <div class="income">
                        <p>income</p>
                        <p class="mon">$00.00</p>
                    </div>

                    <div class="expense">
                        <p>expense</p>
                        <p class="exp">$00.00</p>

                    </div>
                 </div>
          </div>

          <div class="transactions">Transactions</div>
          <div class="belowtran">
            <div class="labelsbox">
                <!-- <div class="labels">
                    <div>dsa</div>
                    <div>$00.00&nbsp;&nbsp;&nbsp;<span class="wrong">&Cross;</span></div>
                </div>     -->
            </div>
            <div class="forms">
              <p class="w">Add Transcation</p>
              <form action="">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="Enter description">
                <label for="amount">amount</label>
                <input type="number" id="amount" placeholder="Enter amount">
                <p class="q">use negitive (-) for expenses</p>
              </form>
              <button class="addtran">Add Transcation</button>
            </div>
          </div>

    </div>

    <script src="expense_javascript.js"></script>
</body>
</html>
